name: Dart CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: install dependencies
        run: dart pub get

      # We don't run formatter as we want to keep unormdata.dart as is.
      # - name: Verify formatting
      #   run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze

      - name: test on vm
        run: dart pub run test --platform vm

      - name: test on chrome
        run: dart pub run test --platform chrome ./test/unorm_dart_test.dart

      - name: Dry-run publish
        run: dart pub publish --dry-run
